[build]
  base = "alba-frontend"
  command = "npm run build"
  publish = "dist"

# SPA routing (React Router fix)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy to Render backend (optional but recommended)
[[redirects]]
  from = "/api/*"
  to = "https://alba-marine.onrender.com/api:splat"
  status = 200
  force = true
